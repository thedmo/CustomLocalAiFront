# Gerüst für AP06. Entscheid Docker Compose (Konzept 6.5), Modellserver Docker Model Runner (6.4).
# Der Model Runner läuft nicht als eigener Dienst in dieser Datei, sondern in Docker Desktop; aus dem
# Container ist er unter http://model-runner.docker.internal erreichbar (Konzept 7.3, docs/Schnittstellen.md).
# [AP06 prüft: Adresse und Pfad aus dem Spike, Modell-Pull-Befehl, ob der Compose-Eintrag "models:" genutzt wird.]
services:
  chat:
    build:
      context: .
      dockerfile: src/Chat.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Chat__AdresseModellserver=http://model-runner.docker.internal/engines/v1
      - Chat__Modellname=MODELLNAME_AUS_KONZEPT_6_8
      - Chat__SpeicherortDb=/data/chat.db
      - Chat__Protokolldatei=/data/protokoll.log
    volumes:
      - ./data:/data
    restart: unless-stopped
