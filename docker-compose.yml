services:
  gateway:
    build:
      context: .
      dockerfile: src/LocalAiFront/Dockerfile
    container_name: local-ai-gateway
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - TZ=Europe/Berlin
    volumes:
      - ./data:/app/data
    models:
      llm:
        endpoint_var: MODEL_RUNNER_URL
    restart: unless-stopped

models:
  llm:
    model: ${MODEL_NAME}
    context_size: 4096
