<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body>
    <div class="container">
        <h1>Local Chat</h1>
        <label class="label" for="prompt">Prompt</label>
        <textarea id="prompt" placeholder="Gib hier deinen Prompt ein..."></textarea>
        <button id="sendBtn" type="button">Antwort generieren</button>
        <div id="status" class="status"></div>
        <div class="response" id="response">Antwort erscheint hier...</div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
