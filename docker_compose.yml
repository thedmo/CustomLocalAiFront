services:
  gateway:
    build:
      context: .
      dockerfile: src/LocalAiFront/Dockerfile
    container_name: local-ai-gateway
    ports:
      - "80:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Chat__Modellname=${MODEL_NAME:-hf.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q3_K_M}
    volumes:
      - ./data:/app/data
    models:
      llm:
        endpoint_var: MODEL_RUNNER_URL
    restart: unless-stopped

models:
  llm:
    model: ${MODEL_NAME:-hf.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q3_K_M}
    context_size: 4096
